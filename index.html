<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
    }

    .container {
      width: 100%;
      max-width: 700px;
      padding: 20px;
      text-align: center;
    }

    .logo {
      font-size: 64px;
      font-weight: 500;
      margin-bottom: 35px;
      color: #4285f4;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      width: 100%;
      height: 50px;
      border: 1px solid #dfe1e5;
      border-radius: 25px;
      padding: 0 25px;
      font-size: 18px;
      outline: none;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
      transition: box-shadow 0.2s;
    }

    .search-box:hover,
    .search-box:focus {
      box-shadow: 0 1px 8px rgba(32, 33, 36, 0.25);
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      border: none;
      background: #f8f9fa;
      padding: 12px 22px;
      margin: 5px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      border: 1px solid #dadce0;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 48px;
      }

      .search-box {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Search</div>

    <form
      class="search-form"
      action="https://formsfree.io/f/xozaejvr"
      method="POST"
    >

      <input
        type="text"
        name="search_text"
        class="search-box"
        placeholder="Search..."
        autocomplete="off"
        required
      >

      <div class="buttons">
        <button type="submit">Search</button>
      </div>

    </form>

  </div>

</body>
</html>
