<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: 70px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: -5px;
        }

        .search-form {
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 30px;
            height: 55px;
            padding: 0 20px;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
        }

        .search-form:focus-within {
            box-shadow: 0 1px 8px rgba(32, 33, 36, 0.25);
        }

        .search-icon {
            font-size: 22px;
            color: #777;
            margin-right: 12px;
        }

        #searchBox {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
        }

        .search-button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 22px;
        }

        #result {
            margin-top: 30px;
            font-size: 20px;
            color: #333;
            min-height: 30px;
        }

        .buttons {
            margin-top: 25px;
        }

        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            background: #f8f9fa;
            cursor: pointer;
        }

        .buttons button:hover {
            border-color: #aaa;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Search
    </div>

    <!-- Formspree Form -->
    <form
        id="searchForm"
        class="search-form"
        action="https://formspree.io/f/myegwreb"
        method="POST"
    >

        <span class="search-icon">⌕</span>

        <input
            type="text"
            id="searchBox"
            name="search"
            placeholder="Search..."
            autocomplete="off"
            required
        >

        <button type="submit" class="search-button">
            🔍
        </button>

    </form>

    <div class="buttons">
        <button type="submit" form="searchForm">
            Search
        </button>
        <button type="button" onclick="showMessage()">
            I'm Feeling Lucky
        </button>
    </div>

    <div id="result"></div>

</div>


<script>

    const form = document.getElementById("searchForm");
    const searchBox = document.getElementById("searchBox");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const userText = searchBox.value.trim();

        if (userText === "") {
            result.textContent = "Please enter something to search.";
            return;
        }

        // Show the text entered by the user
        result.innerHTML =
            "You searched for: <strong>" +
            escapeHTML(userText) +
            "</strong>";

        // Send the search text to Formspree
        try {

            const response = await fetch(
                "https://formspree.io/f/myegwreb",
                {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        search: userText
                    })
                }
            );

            if (response.ok) {
                console.log("Search submitted successfully.");
            } else {
                console.log("Formspree submission failed.");
            }

        } catch (error) {
            console.log("Error:", error);
        }

    });


    function showMessage() {

        const userText = searchBox.value.trim();

        if (userText === "") {
            result.textContent = "Please enter something first.";
            return;
        }

        result.innerHTML =
            "Lucky search: <strong>" +
            escapeHTML(userText) +
            "</strong>";
    }


    // Prevent HTML entered by the user from being interpreted as HTML
    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

</script>

</body>
</html>
